<title>LOPAD 무기 발현 대장</title>
<style>
/* 레이아웃: 좌측 무기 탭 + 우측 장부. 어두운 일기장 기조(세피아 잉크), 라이트는 바랜 종이. */
:root{
  --bg:#17130f; --paper:#201a15; --paper2:#2a221b; --ink:#e9dcc8; --ink-dim:#9b8b77; --rule:#4a3c2f;
  --accent:#e0a040; --accent-dim:#8a5a1e; --mod:#8fd0a0; --danger:#d86a5a;
  --mono:"Galmuri11","Nanum Gothic Coding",ui-monospace,Menlo,monospace; --body:"Noto Sans KR",system-ui,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){ --bg:#efe6d6; --paper:#f7f0e3; --paper2:#eadfcc; --ink:#2a2118; --ink-dim:#6e6050; --rule:#c9b99f; --accent:#9a5a12; --accent-dim:#c89a5a; --mod:#2f7a4a; --danger:#b23a2a; color-scheme:light } }
:root[data-theme="light"]{ --bg:#efe6d6; --paper:#f7f0e3; --paper2:#eadfcc; --ink:#2a2118; --ink-dim:#6e6050; --rule:#c9b99f; --accent:#9a5a12; --accent-dim:#c89a5a; --mod:#2f7a4a; --danger:#b23a2a; color-scheme:light }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);padding-block:20px;padding-inline:16px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--rule);padding-bottom:10px;margin-bottom:14px}
h1{font-size:22px;margin:0;letter-spacing:.02em;text-wrap:balance}
.sub{color:var(--ink-dim);font-size:13px}
.status{font-size:12px;color:var(--ink-dim);font-variant-numeric:tabular-nums}
.status b{color:var(--accent)}
.layout{display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px}
@media (max-width:760px){.layout{grid-template-columns:1fr}}
nav.tabs{display:flex;flex-direction:column;gap:6px}
nav.tabs button{all:unset;cursor:pointer;padding:10px 12px;border:1px solid var(--rule);background:var(--paper);border-radius:4px;display:flex;justify-content:space-between;gap:8px}
nav.tabs button[aria-selected="true"]{border-color:var(--accent);background:var(--paper2)}
nav.tabs button:focus-visible{outline:2px solid var(--accent)}
nav .cnt{color:var(--ink-dim);font-size:12px;font-variant-numeric:tabular-nums}
main{min-width:0}
section.card{background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:14px 16px;margin-bottom:14px}
h2{font-size:15px;margin:0 0 8px;color:var(--accent);letter-spacing:.04em;text-transform:none}
h3{font-size:13px;margin:12px 0 6px;color:var(--ink-dim);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px 14px}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field label{font-size:11px;color:var(--ink-dim);letter-spacing:.03em}
.field .path{font-family:var(--mono);font-size:10px;color:var(--ink-dim);opacity:.7;word-break:break-all}
.field input,.field textarea{font:inherit;font-variant-numeric:tabular-nums;background:var(--paper2);color:var(--ink);border:1px solid var(--rule);border-radius:3px;padding:5px 7px;min-width:0;width:100%}
.field textarea{min-height:48px;resize:vertical;font-size:13px}
.field input:focus,.field textarea:focus{outline:2px solid var(--accent);border-color:transparent}
.field.changed input,.field.changed textarea{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.field input:disabled,.field textarea:disabled{opacity:.6}
.tree{display:grid;gap:10px}
.node{border:1px solid var(--rule);border-radius:4px;padding:10px 12px;background:var(--paper2)}
.node.t2{margin-left:18px;background:var(--paper)}
.node .head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;margin-bottom:6px}
.node .head .nm{font-weight:700}
.node .head .id{font-family:var(--mono);font-size:11px;color:var(--ink-dim)}
.tier{font-size:11px;color:var(--accent);border:1px solid var(--accent-dim);border-radius:3px;padding:1px 6px}
.mods{font-family:var(--mono);font-size:12px;color:var(--mod);white-space:pre-wrap;word-break:break-word}
.affin{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
@media (max-width:620px){.affin{grid-template-columns:repeat(3,minmax(0,1fr))}}
.bar{height:6px;background:var(--rule);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.changes{display:grid;gap:6px}
.chg{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;font-size:12px;border-bottom:1px dashed var(--rule);padding:4px 0}
.chg .p{font-family:var(--mono);word-break:break-all}
.chg .v{color:var(--accent)}
.chg .old{color:var(--ink-dim);text-decoration:line-through;margin-right:6px}
.chg button{all:unset;cursor:pointer;color:var(--danger);font-size:12px;padding:2px 6px;border:1px solid var(--rule);border-radius:3px}
.chg button:focus-visible{outline:2px solid var(--accent)}
.empty{color:var(--ink-dim);font-size:13px}
.note{font-size:12px;color:var(--ink-dim);border-left:2px solid var(--accent-dim);padding-left:8px;margin-top:8px}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--paper2);color:var(--ink);border:1px solid var(--accent);padding:8px 14px;border-radius:4px;font-size:13px;opacity:0;transition:opacity .2s}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
.fxgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.fx{border:1px solid var(--rule);border-radius:4px;padding:10px;background:var(--paper2);min-width:0}
.fx .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:6px}
.fx .t b{font-size:13px}
.fx .t code{font-family:var(--mono);font-size:11px;color:var(--ink-dim)}
.fx canvas{display:block;image-rendering:pixelated;background:#0e0b09;border:1px solid var(--rule);border-radius:3px;max-width:100%}
.fx .sheet{display:block;image-rendering:pixelated;max-width:100%;margin-top:6px;border:1px solid var(--rule);background:#0e0b09}
.fx .meta{font-family:var(--mono);font-size:11px;color:var(--ink-dim);margin-top:6px;line-height:1.6;word-break:break-word}
.fx .dirs{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.fx .dirs button{all:unset;cursor:pointer;font-size:11px;padding:2px 7px;border:1px solid var(--rule);border-radius:3px}
.fx .dirs button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.fx .dirs button:focus-visible{outline:2px solid var(--accent)}
.toggle{all:unset;cursor:pointer;font-size:12px;color:var(--accent);border:1px solid var(--accent-dim);border-radius:3px;padding:2px 8px;margin-left:8px}
</style>

<header>
  <div><h1>LOPAD 무기 발현 대장</h1><div class="sub">무기 4종의 기본 성능 · 우클릭 보조 동작 · 개성 성향 · 분기 트리(1차→2차) · 강화 규칙. 칸을 고치면 바로 저장되고 아래 변경 목록에 쌓입니다.</div></div>

</section>
</div>

function getPath(obj,path){return path.split('.').reduce((o,k)=>o==null?undefined:o[k],obj)}
function docId(path){return path.replace(/[^A-Za-z0-9_.~:@+-]/g,'_')}
function effective(path){const o=overrides[docId(path)];return o?o.value:getPath(BASE,path)}
function field(path,label,opts={}){
  const base=getPath(BASE,path); const val=effective(path); const changed=docId(path) in overrides;
  const isNum=typeof base==='number'; const isLong=typeof base==='string'&&base.length>24;
  const id='f_'+docId(path).replace(/\W/g,'_');
  const ctl=isLong?`<textarea id="${id}" data-path="${path}" ${canWrite===false?'disabled':''}>${esc(val)}</textarea>`
    :`<input id="${id}" data-path="${path}" type="${isNum?'number':'text'}" ${isNum?'step="any"':''} value="${esc(val)}" ${canWrite===false?'disabled':''}>`;
  return `<div class="field ${changed?'changed':''}"><label for="${id}">${label||LABELS[path.split('.').pop()]||path.split('.').pop()}</label>${ctl}<span class="path">${opts.showPath===false?'':path}</span></div>`;
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderTabs(){
  $('#tabs').innerHTML = WEAPON_ORDER.map(id=>{const w=BASE.weapons[id];const n=Object.keys(overrides).filter(k=>k.startsWith('weapons.'+id+'.')).length;
    return `<button role="tab" aria-selected="${id===current}" data-w="${id}"><span>${esc(w.name)}</span><span class="cnt">${n?n+' 수정':''}</span></button>`}).join('')
    + `<button role="tab" aria-selected="${current==='fx'}" data-w="fx"><span>이펙트 공통</span><span class="cnt">${BASE.fxSecondary.length+BASE.fxCommon.length}</span></button>`
    + `<button role="tab" aria-selected="${current==='rules'}" data-w="rules"><span>공통 규칙</span><span class="cnt">${Object.keys(overrides).filter(k=>k.startsWith('rules.')||k.startsWith('personality.')).length||''}</span></button>`;
}
function renderWeapon(id){
  const w=BASE.weapons[id]; const P='weapons.'+id; let h='';
  h+=`<section class="card"><h2>${esc(w.name)} · 기본 성능</h2><div class="grid">`+
    [field(P+'.name'),field(P+'.damageMult'),field(P+'.critBonus'),field(P+'.attackSlowMult'),
     field(P+'.hitbox.width'),field(P+'.hitbox.height'),field(P+'.hitbox.reach'),field(P+'.hitbox.activeMs'),field(P+'.hitbox.cooldownMs')].join('')+
    (w.ranged?Object.keys(w.ranged).map(k=>field(P+'.ranged.'+k)).join(''):'')+`</div></section>`;
  const s=w.secondary;
  h+=`<section class="card"><h2>우클릭 보조 동작 · ${esc(SEC_KIND[s.kind]||s.kind)}</h2><div class="grid">`+
    Object.keys(s).filter(k=>k!=='kind').map(k=>field(P+'.secondary.'+k)).join('')+`</div></section>`;
  h+=`<section class="card"><h2>개성 성향 (운명 결정 좌표)</h2><p class="sub">3획·5초 리듬에서 뽑은 6축(0~1)과 가장 가까운 무기로 정해진다.</p><div class="affin">`+
    Object.keys(w.affinity).map(k=>{const v=effective(P+'.affinity.'+k);return `<div>${field(P+'.affinity.'+k,undefined,{showPath:false})}<div class="bar"><i style="width:${Math.max(0,Math.min(1,+v))*100}%"></i></div></div>`}).join('')+`</div></section>`;
  const th=w.personality.thresholds;
  h+=`<section class="card"><h2>개성 분기 트리</h2><div class="grid" style="margin-bottom:10px">`+th.map((t,i)=>field(P+'.personality.thresholds.'+i,`${i+1}차 임계`)).join('')+`</div><div class="tree">`;
  w.personality.branches.forEach((b,i)=>{
    const BP=P+'.personality.branches.'+i;
    h+=node(BP,b,'1차',1);
    (b.next||[]).forEach((n,j)=>{h+=node(BP+'.next.'+j,n,'2차',2)});
  });
  h+=`</div></section>`;
  h+=`<section class="card"><h2>이펙트 · ${esc(w.name)}</h2><p class="sub">기본 공격 → 1차 진화 → 2차 진화 순. 시트는 1층 호박 램프로 그려져 있고 게임에서는 층 강조색으로 바뀐다. 캔버스는 프레임 시간표대로 재생.</p><div class="fxgrid">`;
  if(BASE.overlays[id]) h+=fxCard('overlay_'+id, Object.assign({label:'손에 든 무기(공격 오버레이)'},BASE.overlays[id]));
  (BASE.fxByWeapon[id]||[]).forEach(f=>{ if(BASE.fx[f]) h+=fxCard(f,BASE.fx[f]); });
  h+=`</div></section>`;
  return h;
}
function fxCard(fid,d){
  const dirs=d.directions||['any']; const scale=d.frameWidth>=64?3:d.frameWidth>=32?4:6;
  return `<div class="fx" data-fx="${fid}"><div class="t"><b>${esc(d.label||fid)}</b><code>${fid}</code></div>
  <canvas width="${d.frameWidth*scale}" height="${d.frameHeight*scale}" data-fx-canvas="${fid}" data-scale="${scale}" data-dir="0"></canvas>
  ${dirs.length>1?`<div class="dirs">${dirs.map((n,i)=>`<button data-dir-btn="${fid}" data-i="${i}" aria-pressed="${i===0}">${n}</button>`).join('')}</div>`:''}
  <img class="sheet" src="${d.png}" alt="${esc(fid)} 시트" style="width:${Math.min(100, 2*100)}%;max-width:${(d.frameWidth*(d.frames||1))*2}px">
  <div class="meta">${d.frameWidth}×${d.frameHeight} · ${d.frames}프레임 · ${(d.frameDurationsMs||[]).join('/')}ms${d.loop?' · 루프':''}<br>앵커 ${esc(d.anchor||'-')} · 피벗 ${d.pivot?d.pivot.x+','+d.pivot.y:'-'} · 재생 ${esc(d.spawn||'-')} · 깊이 ${esc(typeof d.depth==='object'?JSON.stringify(d.depth):(d.depth||'-'))}${d.rotate?' · 회전':''}${d.tile?' · 타일링':''}</div></div>`;
}
function renderFxCommon(){
  let h=`<section class="card"><h2>보조 동작·대쉬 연출</h2><div class="fxgrid">`+BASE.fxSecondary.map(f=>BASE.fx[f]?fxCard(f,BASE.fx[f]):'').join('')+`</div></section>`;
  h+=`<section class="card"><h2>피격·예고·적 투사체</h2><div class="fxgrid">`+BASE.fxCommon.map(f=>BASE.fx[f]?fxCard(f,BASE.fx[f]):'').join('')+`</div></section>`;
  return h;
}
const fxImages={};
function fxImage(fid,src){ if(!fxImages[fid]){const im=new Image();im.src=src;fxImages[fid]=im;} return fxImages[fid]; }
function fxSource(fid){ return fid.startsWith('overlay_')?BASE.overlays[fid.slice(8)]:BASE.fx[fid]; }
let fxTimer=null;
function animateFx(){
  clearInterval(fxTimer);
  const canvases=[...document.querySelectorAll('[data-fx-canvas]')]; if(!canvases.length) return;
  const state=canvases.map(c=>({c,fid:c.dataset.fxCanvas,frame:0,t:0}));
  let last=performance.now();
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  fxTimer=setInterval(()=>{
    const now=performance.now(); const dt=now-last; last=now;
    state.forEach(s=>{
      const d=fxSource(s.fid); if(!d) return; const im=fxImage(s.fid,d.png); if(!im.complete) return;
      const dur=(d.frameDurationsMs&&d.frameDurationsMs[s.frame])||120;
      if(!reduce){ s.t+=dt; if(s.t>=Math.max(40,dur)){ s.t=0; s.frame=(s.frame+1)%(d.frames||1); if(s.frame===0&&!d.loop) s.hold=(s.hold||0); } }
      const dir=+s.c.dataset.dir||0; const sc=+s.c.dataset.scale; const ctx=s.c.getContext('2d'); ctx.imageSmoothingEnabled=false;
      ctx.clearRect(0,0,s.c.width,s.c.height);
      ctx.drawImage(im, s.frame*d.frameWidth, dir*d.frameHeight, d.frameWidth, d.frameHeight, 0,0, d.frameWidth*sc, d.frameHeight*sc);
    });
  }, 40);
}
function node(path,b,tier,level){
  return `<div class="node t${level}"><div class="head"><span class="tier">${tier}</span><span class="nm">${esc(effective(path+'.name'))}</span><span class="id">${esc(b.id)}</span></div>
  <div class="grid">${field(path+'.name')}${field(path+'.description')}${field(path+'.damageMult')}${field(path+'.hitboxMult')}</div>
  <h3>효과 키(mods)</h3><div class="mods">${esc(JSON.stringify(b.mods||{}))}</div>${modFields(path+'.mods',b.mods||{})}</div>`;
}
function modFields(path,mods){
  const fs=[];(function walk(p,o){for(const k of Object.keys(o)){const v=o[k];if(typeof v==='number')fs.push(field(p+'.'+k,k));else if(v&&typeof v==='object')walk(p+'.'+k,v)}})(path,mods);
  return fs.length?`<div class="grid" style="margin-top:6px">${fs.join('')}</div>`:'';
}
function renderRules(){
  const pp=BASE.personality;
  return `<section class="card"><h2>강화 규칙</h2><div class="grid">${field('rules.reinforceBonus')}${field('rules.reinforceMax')}</div><p class="note">임계 도달 시 3지선다: 변환 A / 변환 B / 현재 개성 강화(피해·범위 +보너스, 최대 횟수까지).</p></section>`+
  `<section class="card"><h2>개성 선택 입력 파라미터</h2><h3>3획</h3><div class="grid">${Object.keys(pp.strokes).map(k=>field('personality.strokes.'+k)).join('')}</div><h3>5초 리듬</h3><div class="grid">${Object.keys(pp.rhythm).map(k=>field('personality.rhythm.'+k)).join('')}</div><h3>축 가중치</h3><div class="grid">${Object.keys(pp.weights).map(k=>field('personality.weights.'+k)).join('')}</div></section>`;
}
function renderChanges(){
  const keys=Object.keys(overrides).sort();
  $('#changes').innerHTML = keys.length? keys.map(k=>{const o=overrides[k];return `<div class="chg"><div><div class="p">${esc(o.path)}</div><span class="old">${esc(o.base)}</span><span class="v">${esc(o.value)}</span></div><button data-revert="${k}" ${canWrite===false?'disabled':''}>되돌리기</button></div>`}).join('')
    :'<div class="empty">아직 바꾼 값이 없습니다.</div>';
}
function render(){ renderTabs(); $('#main').innerHTML = current==='rules'?renderRules():current==='fx'?renderFxCommon():renderWeapon(current); renderChanges(); animateFx(); }
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-w]'); if(t){current=t.dataset.w; try{localStorage.setItem('lopad-weapon-tab',current)}catch(_){ } render(); return;}
  const b=e.target.closest('[data-dir-btn]'); if(b){ const c=document.querySelector(`[data-fx-canvas="${CSS.escape(b.dataset.dirBtn)}"]`); if(c) c.dataset.dir=b.dataset.i; b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed', x===b)); return; }
  const r=e.target.closest('[data-revert]'); if(r&&db){ db.doc('overrides/'+r.dataset.revert).delete().then(()=>toast('기본값으로 되돌림')).catch(()=>toast('되돌리기 실패')); }
});
let pending={};
document.addEventListener('input',e=>{
  const el=e.target; if(!el.dataset.path) return;
  const path=el.dataset.path; clearTimeout(pending[path]);
  pending[path]=setTimeout(()=>commit(path,el.value),500);
});
async function commit(path,raw){
  const base=getPath(BASE,path); let value=raw;
  if(typeof base==='number'){ if(raw.trim()===''||isNaN(+raw)) return; value=+raw; }
  const id=docId(path);
  if(!db){ toast('저장 불가: 장부 연결 없음'); return; }
  if(value===base){ if(id in overrides){ try{ await db.doc('overrides/'+id).delete(); }catch(_){} } return; }
  if(overrides[id]&&overrides[id].value===value) return;
  try{ await db.doc('overrides/'+id).set({path,value,base,at:new Date().toISOString()}); toast('저장됨: '+path.split('.').slice(-2).join('.')); }
  catch(err){ if(err&&err.code==='invalid_argument'){ canWrite=false; render(); } toast('저장 실패'); }
}
(async()=>{
  try{ current=localStorage.getItem('lopad-weapon-tab')||current; }catch(_){ }
  render();
  const user=await window.claude?.use?.('user'); if(user){ try{ canWrite=await user.can('data.write'); }catch(_){ } }
  db=await window.claude?.use?.('db');
  if(!db){ $('#status').textContent='장부 연결 없음 — 읽기 전용'; canWrite=false; render(); return; }
  db.collection('overrides').onSnapshot(snap=>{
    overrides={}; snap.docs.forEach(d=>{ if(d.exists){ const b=d.data(); overrides[d.id]={path:b.path,value:b.value,base:b.base}; } });
    const n=Object.keys(overrides).length; $('#status').innerHTML=`수정 <b>${n}</b>건 · ${canWrite===false?'읽기 전용':'실시간 저장'}`;
    const active=document.activeElement; const keep=active&&active.dataset&&active.dataset.path;
    render(); if(keep){ const el=document.querySelector(`[data-path="${CSS.escape(keep)}"]`); if(el) el.focus(); }
  }, err=>{ $('#status').textContent='장부 오류: '+(err&&err.code||'unknown'); });
})();
</script>
